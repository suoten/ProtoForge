[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protoforge"
version = "1.2.4"
description = "IoT Protocol Simulation & Testing Platform - Postman for IoT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "suoten", email = "suoten@163.com" },
]
keywords = ["iot", "modbus", "opc-ua", "mqtt", "simulation", "testing", "gb28181", "bacnet", "s7", "mc", "fins", "ab", "opc-da", "fanuc", "mtconnect", "toledo", "iec104", "iec61850", "coap", "dds"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pymodbus>=3.6.0,<3.13",  # FIXED(Issue#8): pymodbus 3.13+ breaks ModbusServerContext/ModbusSequentialDataBlock API
    "aiosqlite>=0.19.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.1",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
deploy = ["gunicorn>=21.2.0"]
# V1.1.0: IEC 104, IEC 61850, CoAP, DDS are pure Python — no extra dependencies needed
# They are included in the core package and work out of the box
opcua = ["asyncua>=1.0.0", "cryptography>=42.0.0"]
mqtt = ["amqtt>=0.11.0"]
bacnet = ["bacpypes>=0.18.0"]  # FIXED: add missing bacnet extras
s7 = ["python-snap7>=1.3.0"]  # FIXED: add missing s7 extras
postgres = ["asyncpg>=0.29.0"]
grpc = ["grpcio>=1.62.0", "grpcio-tools>=1.62.0"]
all = [
    "asyncua>=1.0.0",
    "cryptography>=42.0.0",
    "amqtt>=0.11.0",
    "bacpypes>=0.18.0",
    "python-snap7>=1.3.0",
    "asyncpg>=0.29.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.8.0",
    "alembic>=1.13.0",
]

[project.scripts]
protoforge = "protoforge.cli:main"

[project.urls]
Homepage = "https://gitee.com/suoten/protoforge"
Repository = "https://gitee.com/suoten/protoforge"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".convergeloop",
    ".git",
    "__pycache__",
    "htmlcov",
    "data",
    "logs",
    "scripts",
    "sdk",
    "web",
    "test_screenshots",
    "migrations",
    "diag_push.py",
    "*.bak",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "C901"]
ignore = ["E501", "B008", "SIM102", "SIM115"]  # B008: FastAPI Depends(); SIM102: nested if in complex paths; SIM115: NamedTemporaryFile pattern

[tool.ruff.lint.mccabe]
max-complexity = 35

[tool.ruff.lint.per-file-ignores]
"protoforge/mqtt_auth.py" = ["F401"]  # Optional dependency imports
"protoforge/protocols/mqtt/server.py" = ["F401"]  # Optional dependency imports
"protoforge/protocols/opcua/client.py" = ["F401"]  # Optional dependency imports
"protoforge/protocols/opcua/server.py" = ["F401"]  # Optional dependency imports
"protoforge/api/v1/router.py" = ["E402"]  # FastAPI router pattern: create router then import sub-routers
"protoforge/grpc/server.py" = ["N802"]  # gRPC methods must be PascalCase per protocol convention
"protoforge/simulation/behavior_models.py" = ["N803", "N806"]  # Physics variables (Kp, Ki, Kd, dT, J, A, dL)
"protoforge/engine/defaults.py" = ["E402"]  # Lazy import pattern for optional dependencies
"protoforge/simulation/testing.py" = ["E402"]  # Lazy import pattern
"protoforge/protocols/fanuc/server.py" = ["N806"]  # Local constants (_READ_TIMEOUT)
"protoforge/protocols/fins/server.py" = ["N806"]  # Local constants (_READ_TIMEOUT)
"protoforge/protocols/modbus/rtu_server.py" = ["N806"]  # Local constants (_RTU_CONN_TIMEOUT)
"protoforge/protocols/mtconnect/server.py" = ["N806"]  # Local constants (_READ_TIMEOUT)
"protoforge/protocols/opcda/server.py" = ["N806"]  # Local constants (_READ_TIMEOUT)
"protoforge/protocols/toledo/server.py" = ["N806"]  # Local constants (_READ_TIMEOUT)
"protoforge/audit/exception_lint.py" = ["N815"]  # AST visitor method names
"protoforge/integrations/edgelite.py" = ["N806"]  # Local constant (_PLUGIN_NAME_TO_ALIAS)
"protoforge/main.py" = ["N806"]  # Local constant (_EXAMPLE_SECRET)
"protoforge/api/v1/common.py" = ["N818"]  # Exception naming convention (base class pattern)
"scripts/acceptance_test_deep.py" = ["E402"]  # sys.path bootstrap before imports
"scripts/acceptance_test_edge.py" = ["E402"]  # sys.path bootstrap before imports
"scripts/diag_el_data2.py" = ["E402"]  # sys.path bootstrap before imports
"protoforge/simulation/fault_injection.py" = ["N818"]  # Exception naming convention

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "migrations/",
    "tests/",
]

[[tool.mypy.overrides]]
module = "pymodbus.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncua.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "amqtt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
# Coverage ratchet: measured 40.5% at v1.1.0; raise in small steps (+1) as tests are added
addopts = "--cov=protoforge --cov-report=term-missing --cov-report=html --cov-report=xml --cov-report=json --cov-fail-under=41"
