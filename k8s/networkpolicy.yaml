apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protoforge-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: protoforge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: protoforge
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: protoforge-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: protoforge-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: protoforge
