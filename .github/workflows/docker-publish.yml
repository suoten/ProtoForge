name: Docker Build and Push

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: suoten/protoforge
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        id: docker_login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.docker_login.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # v1.12.0: PyPI 分发名启用 protoforge-sim 后恢复真实发布。
  # 历史：PyPI "protoforge" 名被无关项目占用（owner: Okediya，0.1.0 后无维护），
  # 原 publish-pypi job 必然 403，曾降级为仅构建验证。
  # 启用发布：repo Settings → Secrets and variables → Actions 配置 PYPI_API_TOKEN
  # （pypi.org → Account settings → API tokens，scope 选 project: protoforge-sim）。
  # 未配置时自动跳过上传，仅保留构建验证信号。
  pypi-publish:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      PYPI_TOKEN_SET: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build sdist & wheel (publish smoke check)
        run: python -m build

      - name: Verify artifacts
        run: |
          ls -la dist/
          test -f dist/*.tar.gz || (echo "missing sdist" && exit 1)
          test -f dist/*.whl || (echo "missing wheel" && exit 1)

      - name: Publish protoforge-sim to PyPI
        if: env.PYPI_TOKEN_SET == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Build-only notice (PYPI_API_TOKEN not configured)
        if: env.PYPI_TOKEN_SET != 'true'
        run: |
          echo "::notice::PYPI_API_TOKEN not configured - build check only, no upload."
          echo "::notice::To enable PyPI publishing: Settings → Secrets and variables → Actions → New repository secret → PYPI_API_TOKEN"
