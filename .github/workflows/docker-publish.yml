name: Docker Build and Push

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: suoten/protoforge
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        id: docker_login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.docker_login.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # FIXED: 原 publish-pypi job 因 PyPI "protoforge" 包名被无关项目占用
  # （owner: Okediya）必然 403，每次发版留一个红色 job。改为仅构建验证：
  # 保留 "python -m build 能成功打包" 的 CI 信号，去掉上传步骤。
  # 实际分发渠道：DockerHub（suoten/protoforge）+ GitHub Release 便携包。
  # 若未来改用未占用名称（如 protoforge-iot）并配置 PYPI_API_TOKEN，
  # 可参照 pypa/gh-action-pypi-publish 加回发布步骤。
  package-build-check:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build sdist & wheel (publish smoke check)
        run: python -m build

      - name: Verify artifacts
        run: |
          ls -la dist/
          test -f dist/*.tar.gz || (echo "missing sdist" && exit 1)
          test -f dist/*.whl || (echo "missing wheel" && exit 1)
