[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# NOTE: This SQLite URL is only a placeholder default. It is overridden at runtime by
# migrations/env.py via the PROTOFORGE_DB_PATH environment variable. In production,
# set PROTOFORGE_DB_PATH to point to the actual database.
# NOTE: Uses the aiosqlite async driver, compatible with async_engine_from_config in env.py.
# (Keep this file ASCII-only: configparser decodes it with the system locale, which breaks
#  on Windows GBK systems if non-ASCII characters are present.)
sqlalchemy.url = sqlite+aiosqlite:///data/protoforge.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
