[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    smoke: Smoke tests for application startup and core endpoints
    integration: Integration tests for protocol servers
    slow: Slow tests that may take more than 5 seconds
filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning
addopts = --cov=protoforge --cov-report=term-missing --cov-report=html --cov-report=xml --cov-report=json --cov-fail-under=18
